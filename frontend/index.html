<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KisanMitra AI</title>
<style>
  :root { --g:#2e7d32; --gl:#e8f5e9; --bd:#d7e3d8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans", "Noto Sans Gujarati", sans-serif; background:#f4f8f4; color:#1b2b1c; }
  header { background:var(--g); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0; }
  .nav { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .nav a { color:#fff; text-decoration:none; font-size:.95rem; }
  .nav button { padding:6px 10px; font-size:.9rem; }
  main { max-width:720px; margin:0 auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:12px; padding:16px; }
  input, select, textarea, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--bd); }
  input, textarea { width:100%; }
  button { background:var(--g); color:#fff; border:0; cursor:pointer; }
  button.secondary { background:#fff; color:var(--g); border:1px solid var(--g); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > input, .row > textarea { flex:1; }
  .stack > * { margin-top:10px; }
  #log { height:55vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; line-height:1.5; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--g); color:#fff; }
  .model { align-self:flex-start; background:var(--gl); border:1px solid var(--bd); }
  .err { color:#b71c1c; font-size:.9rem; min-height:1.2em; }
  .hide { display:none !important; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button { flex:1; padding:10px 6px; }
  .tabs button.active { background:var(--g); color:#fff; }
  .note { font-size:.8rem; color:#556; margin-top:10px; }
  #micBtn { background:#fff; color:var(--g); border:1px solid var(--g); font-size:1.2rem; padding:10px 12px; }
  #micBtn.listening { background:#c62828; color:#fff; border-color:#c62828; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.55; } }
  #micHint { font-size:.85rem; color:var(--g); min-height:1.2em; margin-top:6px; }
  .opts { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .opts label { font-size:.9rem; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .opts input[type=checkbox] { width:auto; }
  .speakBtn { display:block; margin-top:8px; padding:6px 12px; font-size:.9rem; background:#fff; color:var(--g); border:1px solid var(--g); }
  .speakBtn.speaking { background:#c62828; color:#fff; border-color:#c62828; }
  .wnow { background:var(--gl); border:1px solid var(--bd); border-radius:10px; padding:10px 12px; line-height:1.6; }
  .wtable { overflow-x:auto; }
  .wtable table { width:100%; border-collapse:collapse; font-size:.9rem; }
  .wtable th, .wtable td { border:1px solid var(--bd); padding:6px 8px; text-align:center; white-space:nowrap; }
  .wtable th { background:var(--gl); }
  #wAdvice { max-width:100%; }
  .acwrap { position:relative; }
  .suggest { position:absolute; left:0; right:0; top:100%; z-index:5; background:#fff; border:1px solid var(--bd); border-radius:8px; max-height:260px; overflow-y:auto; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .suggest div { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--bd); }
  .suggest div:last-child { border-bottom:0; }
  .suggest div:hover { background:var(--gl); }
  .suggest div.none { cursor:default; color:#556; }
  .suggest div.none:hover { background:#fff; }
  .suggest small { display:block; color:#556; }
  .picked { background:var(--gl); border:1px solid var(--bd); border-radius:8px; padding:8px 12px; font-size:.9rem; }
  .farm-card { background:var(--gl); border:1px solid var(--bd); border-radius:10px; padding:8px 12px; margin-top:8px; }
  .farm-card pre { margin:0; white-space:pre-wrap; font-family:inherit; line-height:1.5; }

  /* ભાષા પસંદગી સ્ક્રીન */
  #gate { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:12px; }
  #gate .box { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; position:relative; }
  #gate h2 { margin:0 0 4px; font-size:1.1rem; padding-right:28px; }
  #gate p { margin:0; font-size:.85rem; color:#556; }
  #gateGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
  #gateGrid button { padding:14px 8px; font-size:1.05rem; }
  #gateGrid button.current { outline:3px solid #1b5e20; }
  #gateMsg { font-size:.85rem; color:#b71c1c; margin-top:10px; min-height:1.2em; }
  #gateClose { position:absolute; top:8px; right:10px; background:#fff; color:#555; border:0; font-size:1.2rem; padding:4px 8px; }
</style>
</head>
<body>

<!-- ભાષા પસંદગી -->
<div id="gate">
  <div class="box">
    <button id="gateClose" class="hide" aria-label="Close">✕</button>
    <h2>🌐 Choose your language · ભાષા પસંદ કરો · भाषा चुनें</h2>
    <p>Select the language you want to use in the whole app.</p>
    <div id="gateGrid"></div>
    <div id="gateMsg">Loading... · લોડ થઈ રહ્યું છે...</div>
  </div>
</div>

<header>
  <h1>🌾 KisanMitra AI</h1>
  <div class="nav">
    <a href="/app/schemes.html" data-i18n="nav_schemes">🏛️ Schemes</a>
    <button id="btnLang" class="secondary" data-i18n-title="btn_language_title">🌐</button>
    <button id="logoutBtn" class="secondary hide" data-i18n="btn_logout">Log out</button>
  </div>
</header>

<main>
  <!-- લૉગિન / રજિસ્ટર -->
  <section id="authView" class="card stack">
    <div class="tabs">
      <button id="tabLogin" class="active" data-i18n="tab_login">Log in</button>
      <button id="tabRegister" class="secondary" data-i18n="tab_register">New account</button>
    </div>
    <input id="name" class="hide" data-i18n-ph="ph_name" placeholder="Your name" autocomplete="name">
    <input id="email" type="email" data-i18n-ph="ph_email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" data-i18n-ph="ph_password" placeholder="Password" autocomplete="current-password">
    <button id="authBtn">Log in</button>
    <div id="authErr" class="err"></div>
  </section>

  <!-- મુખ્ય -->
  <section id="chatView" class="card hide">
    <div class="tabs">
      <button id="tabChat" class="active" data-i18n="tab_chat">💬</button>
      <button id="tabPhoto" class="secondary" data-i18n="tab_photo">📷</button>
      <button id="tabWeather" class="secondary" data-i18n="tab_weather">🌦️</button>
      <button id="tabFarm" class="secondary" data-i18n="tab_farm">🌾</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="autoSpeak"> <span data-i18n="auto_speak">🔊</span></label>
    </div>

    <div id="chatPane">
      <div id="log"></div>
      <div class="row">
        <textarea id="msg" rows="2" data-i18n-ph="ph_msg"></textarea>
        <button id="micBtn" data-i18n-title="mic_title">🎤</button>
        <button id="sendBtn" data-i18n="btn_send">Send</button>
      </div>
      <div id="micHint"></div>
    </div>

    <div id="photoPane" class="hide stack">
      <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
      <input id="photoQ" data-i18n-ph="ph_photo_q">
      <button id="diagBtn" data-i18n="btn_diagnose">Diagnose</button>
      <div id="diagOut" class="msg model hide"></div>
    </div>

    <div id="weatherPane" class="hide stack">
      <div class="acwrap">
        <input id="wLoc" data-i18n-ph="ph_wloc" autocomplete="off">
        <div id="wSuggest" class="suggest hide"></div>
      </div>
      <div id="wPicked" class="picked hide"></div>
      <button id="gpsBtn" class="secondary" data-i18n="btn_gps">📍</button>
      <input id="wCrop" data-i18n-ph="ph_wcrop">
      <button id="wBtn" data-i18n="btn_weather">Get weather advice</button>
      <div id="wOut" class="hide stack">
        <div id="wNow" class="wnow"></div>
        <div class="wtable"><table id="wTable"></table></div>
        <div id="wAdvice" class="msg model"></div>
      </div>
    </div>

    <!-- Farm Profile -->
    <div id="farmPane" class="hide stack">
      <h3 style="margin:0" data-i18n="farm_title">🌾 Farm Profile</h3>
      <input id="farmName" data-i18n-ph="ph_farm_name">
      <input id="soilType" data-i18n-ph="ph_soil">
      <input id="cropName" data-i18n-ph="ph_crop">
      <input id="cropVariety" data-i18n-ph="ph_variety">
      <input id="landArea" data-i18n-ph="ph_area" inputmode="decimal">
      <select id="areaUnit">
        <option value="acre" data-i18n="unit_acre">Acre</option>
        <option value="hectare" data-i18n="unit_hectare">Hectare</option>
        <option value="bigha" data-i18n="unit_bigha">Bigha</option>
      </select>
      <input id="irrigationType" data-i18n-ph="ph_irrigation">
      <input id="sowingDate" type="date" data-i18n-title="title_sowing_date">
      <textarea id="farmNotes" data-i18n-ph="ph_farm_notes"></textarea>
      <button id="saveFarmBtn" data-i18n="btn_save_farm">Save farm</button>
      <div id="farmErr" class="err"></div>
      <div id="farmList"></div>
    </div>

    <div id="chatErr" class="err"></div>
    <div class="note" data-i18n="note_disclaimer"></div>
  </section>
</main>

<script>
// :8000/app/ પર ખોલો તો સીધું ચાલે. Live Server (:5500) પરથી ખોલો તો પણ ચાલે.
const BASE = location.port === "5500" ? "http://127.0.0.1:8000" : "";
const API = BASE + "/api/v1";
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("km_token") || "";
let chatHistory = [];
let registerMode = false;

// =====================================================
// ભાષા (i18n)
// =====================================================
const FALLBACK_LANGS = [
  { code: "gu", native: "ગુજરાતી", speech: "gu-IN" },
  { code: "hi", native: "हिन्दी", speech: "hi-IN" },
  { code: "en", native: "English", speech: "en-IN" },
];
let LANGS = [];
let curLang = localStorage.getItem("km_lang") || "";
let S = {};    // પસંદ કરેલી ભાષાના શબ્દો
let EN = {};   // English (ખૂટતા શબ્દો માટે)

function t(key, vars) {
  let s = S[key];
  if (s === undefined) s = EN[key];
  if (s === undefined) s = key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}
function langInfo() {
  return LANGS.find((l) => l.code === curLang) || FALLBACK_LANGS[0];
}
function speechCode() {
  return langInfo().speech || "en-IN";
}

async function getJson(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function loadStrings(code) {
  if (!Object.keys(EN).length) EN = await getJson(BASE + "/app/i18n/en.json");
  if (code === "en") return EN;
  if (code === "gu") return await getJson(BASE + "/app/i18n/gu.json");
  const data = await getJson(API + "/i18n/" + encodeURIComponent(code), 120000);
  return data.strings || {};
}

function applyStrings() {
  document.documentElement.lang = curLang || "en";
  document.title = t("doc_title");
  document.querySelectorAll("[data-i18n]").forEach((e) => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((e) => { e.placeholder = t(e.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach((e) => { e.title = t(e.dataset.i18nTitle); });
  $("btnLang").textContent = "🌐 " + langInfo().native;
  setMode(registerMode);
  resetSpeakButtons();
  $("micBtn").title = SR ? t("mic_title") : t("mic_unsupported");
  if (!SR) $("micHint").textContent = t("mic_use_chrome");
  if (token && !$("farmPane").classList.contains("hide")) loadFarms();
}

function renderGate() {
  const grid = $("gateGrid");
  grid.innerHTML = "";
  LANGS.forEach((l) => {
    const b = document.createElement("button");
    b.textContent = l.native;
    if (l.code === curLang) b.className = "current";
    b.onclick = () => chooseLang(l.code);
    grid.appendChild(b);
  });
  $("gateClose").classList.toggle("hide", !curLang || !Object.keys(S).length);
  $("gateMsg").textContent = "";
  $("gate").classList.remove("hide");
}

async function chooseLang(code) {
  const buttons = $("gateGrid").querySelectorAll("button");
  buttons.forEach((b) => { b.disabled = true; });
  $("gateMsg").style.color = "#556";
  $("gateMsg").textContent =
    "Loading... (first time may take up to a minute) · લોડ થઈ રહ્યું છે... (પહેલી વાર 1 મિનિટ લાગી શકે)";
  try {
    const strings = await loadStrings(code);
    stopListening();
    stopSpeaking();
    S = strings;
    curLang = code;
    localStorage.setItem("km_lang", code);
    applyStrings();
    $("gate").classList.add("hide");
  } catch (e) {
    $("gateMsg").style.color = "#b71c1c";
    $("gateMsg").textContent =
      "Could not load this language. Please try again or choose another. · " +
      "આ ભાષા લોડ થઈ શકી નથી. ફરી પ્રયત્ન કરો કે બીજી ભાષા પસંદ કરો.";
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
  }
}
$("btnLang").onclick = renderGate;
$("gateClose").onclick = () => $("gate").classList.add("hide");

// =====================================================
// સામાન્ય
// =====================================================
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/^[ \t]*[*-][ \t]+/gm, "• ")
    .replace(/\n/g, "<br>");
}

// સર્વરના સંદેશને બદલે HTTP કોડ પરથી પસંદ કરેલી ભાષામાં સંદેશ
function statusMessage(status, ctx) {
  if (status === 401) return ctx === "login" ? t("err_bad_login") : t("err_login_again");
  if (status === 400) {
    if (ctx === "register") return t("err_email_exists");
    if (ctx === "diagnose") return t("err_photo_type");
    return t("err_check_details");
  }
  if (status === 404) return ctx === "farm" ? t("err_ai_failed") : t("err_place_not_found");
  if (status === 413) return t("err_photo_big");
  if (status === 422) return t("err_check_details");
  if (status === 503) return t("err_busy");
  return t("err_ai_failed");
}

function showView() {
  const loggedIn = !!token;
  $("authView").classList.toggle("hide", loggedIn);
  $("chatView").classList.toggle("hide", !loggedIn);
  $("logoutBtn").classList.toggle("hide", !loggedIn);
}

function logout() {
  stopListening();
  stopSpeaking();
  token = "";
  sessionStorage.removeItem("km_token");
  chatHistory = [];
  $("log").innerHTML = "";
  $("farmList").innerHTML = "";
  $("wOut").classList.add("hide");
  setPicked(null);
  showView();
}

async function api(path, options = {}, timeoutMs = 90000, ctx = "") {
  options.headers = Object.assign({}, options.headers, { Authorization: "Bearer " + token });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  options.signal = ctrl.signal;
  try {
    const res = await fetch(API + path, options);
    if (res.status === 401) { logout(); throw new Error(t("err_login_again")); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(statusMessage(res.status, ctx));
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error(t("err_timeout"));
    if (e instanceof TypeError) throw new Error(t("err_network"));
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- લૉગિન / રજિસ્ટર ----------
function setMode(reg) {
  registerMode = reg;
  $("name").classList.toggle("hide", !reg);
  $("authBtn").textContent = reg ? t("btn_register") : t("btn_login");
  $("tabLogin").className = reg ? "secondary" : "active";
  $("tabRegister").className = reg ? "active" : "secondary";
  $("authErr").textContent = "";
}
$("tabLogin").onclick = () => setMode(false);
$("tabRegister").onclick = () => setMode(true);

async function doLogin(email, password) {
  const res = await fetch(API + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ username: email, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(statusMessage(res.status, "login"));
  token = data.access_token;
  sessionStorage.setItem("km_token", token);
}

$("authBtn").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  $("authErr").textContent = "";
  $("authBtn").disabled = true;
  try {
    if (registerMode) {
      const res = await fetch(API + "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: $("name").value.trim(), email, password }),
      });
      await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(statusMessage(res.status, "register"));
    }
    await doLogin(email, password);
    $("password").value = "";
    showView();
  } catch (e) {
    $("authErr").textContent = e instanceof TypeError ? t("err_network") : e.message;
  } finally {
    $("authBtn").disabled = false;
  }
};
$("logoutBtn").onclick = logout;

// ---------- 🌾 FARM ----------
function setFarmMsg(text, ok) {
  $("farmErr").textContent = text;
  $("farmErr").style.color = ok ? "#2e7d32" : "";
}

async function loadFarms() {
  const list = $("farmList");
  list.textContent = t("farm_loading");

  try {
    const farms = await api("/farms", {}, 30000, "farm");
    list.textContent = "";

    const items = Array.isArray(farms) ? farms : (farms.farms || []);

    if (!items.length) {
      list.textContent = t("farm_none");
      return;
    }

    items.forEach((farm) => {
      const card = document.createElement("div");
      card.className = "farm-card";

      const details = document.createElement("pre");
      details.textContent = [
        "🌾 " + (farm.farm_name || t("farm_default_name")),
        t("farm_label_crop") + ": " + (farm.crop_name || "-"),
        t("farm_label_soil") + ": " + (farm.soil_type || "-"),
        t("farm_label_area") + ": " + (farm.land_area ?? "-") + " " + (farm.area_unit || ""),
        t("farm_label_irrigation") + ": " + (farm.irrigation_type || "-")
      ].join("\n");

      card.appendChild(details);
      list.appendChild(card);
    });
  } catch (e) {
    list.textContent = e.message;
  }
}

async function saveFarm() {
  const btn = $("saveFarmBtn");
  setFarmMsg("", false);

  const name = $("farmName").value.trim();
  const areaText = $("landArea").value.trim();

  if (!name) { setFarmMsg(t("err_farm_name"), false); return; }
  if (areaText && Number.isNaN(Number(areaText))) { setFarmMsg(t("err_farm_area"), false); return; }

  btn.disabled = true;

  const payload = {
    farm_name: name,
    soil_type: $("soilType").value.trim() || null,
    crop_name: $("cropName").value.trim() || null,
    crop_variety: $("cropVariety").value.trim() || null,
    land_area: areaText ? Number(areaText) : null,
    area_unit: $("areaUnit").value,
    irrigation_type: $("irrigationType").value.trim() || null,
    sowing_date: $("sowingDate").value || null,
    notes: $("farmNotes").value.trim() || null
  };

  try {
    await api("/farms", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }, 30000, "farm");

    setFarmMsg(t("farm_saved"), true);
    $("farmName").value = "";
    $("soilType").value = "";
    $("cropName").value = "";
    $("cropVariety").value = "";
    $("landArea").value = "";
    $("irrigationType").value = "";
    $("sowingDate").value = "";
    $("farmNotes").value = "";

    await loadFarms();
  } catch (e) {
    setFarmMsg(e.message, false);
  } finally {
    btn.disabled = false;
  }
}

// ---------- ટૅબ ----------
function setTab(name) {
  stopListening();
  stopSpeaking();

  $("chatPane").classList.toggle("hide", name !== "chat");
  $("photoPane").classList.toggle("hide", name !== "photo");
  $("weatherPane").classList.toggle("hide", name !== "weather");
  $("farmPane").classList.toggle("hide", name !== "farm");

  [["chat", "tabChat"], ["photo", "tabPhoto"], ["weather", "tabWeather"], ["farm", "tabFarm"]].forEach(([k, id]) => {
    $(id).className = k === name ? "active" : "secondary";
  });

  $("chatErr").textContent = "";
  if (name === "farm") loadFarms();
}
$("tabChat").onclick = () => setTab("chat");
$("tabPhoto").onclick = () => setTab("photo");
$("tabWeather").onclick = () => setTab("weather");
$("tabFarm").onclick = () => setTab("farm");
$("saveFarmBtn").onclick = saveFarm;

// ---------- 🎤 અવાજથી પ્રશ્ન ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;
let baseText = "";

function setListeningUI(on, hint) {
  listening = on;
  $("micBtn").classList.toggle("listening", on);
  $("micBtn").textContent = on ? "⏹" : "🎤";
  $("micHint").textContent = hint || "";
}

function stopListening() {
  if (recognizer && listening) {
    try { recognizer.stop(); } catch (e) {}
  }
}

const MIC_ERRORS = {
  "not-allowed": "mic_not_allowed",
  "service-not-allowed": "mic_not_allowed",
  "no-speech": "mic_no_speech",
  "audio-capture": "mic_no_device",
  "network": "mic_network",
  "language-not-supported": "mic_lang_unsupported",
};

function startListening() {
  stopSpeaking();
  $("chatErr").textContent = "";
  recognizer = new SR();
  recognizer.lang = speechCode();
  recognizer.interimResults = true;
  recognizer.continuous = false;
  baseText = $("msg").value.trim();

  recognizer.onstart = () => setListeningUI(true, t("mic_listening"));
  recognizer.onresult = (event) => {
    let spoken = "";
    for (let i = 0; i < event.results.length; i++) {
      spoken += event.results[i][0].transcript;
    }
    $("msg").value = (baseText ? baseText + " " : "") + spoken;
  };
  recognizer.onerror = (event) => {
    if (event.error !== "aborted") {
      $("chatErr").textContent = t(MIC_ERRORS[event.error] || "mic_error");
    }
  };
  recognizer.onend = () => {
    setListeningUI(false, $("msg").value.trim() ? t("mic_check_send") : "");
  };

  try {
    recognizer.start();
  } catch (e) {
    setListeningUI(false, "");
    $("chatErr").textContent = t("mic_start_fail");
  }
}

if (!SR) $("micBtn").disabled = true;
$("micBtn").onclick = () => {
  if (!SR) return;
  if (listening) stopListening(); else startListening();
};

// ---------- 🔊 જવાબ બોલીને સંભળાવવો ----------
const TTS = window.speechSynthesis;
let speakingBtn = null;

function plainText(s) {
  return String(s || "")
    .replace(/\*\*/g, "")
    .replace(/^[ \t]*[*-][ \t]+/gm, "")
    .replace(/[#_`]/g, "")
    .replace(/\n{2,}/g, "\n");
}

function splitChunks(text) {
  const parts = text.split(/(?<=[.!?।॥\n])\s*/).filter((p) => p.trim());
  const chunks = [];
  let cur = "";
  for (const p of parts) {
    if (cur && (cur + " " + p).length > 160) { chunks.push(cur); cur = p; }
    else cur = cur ? cur + " " + p : p;
  }
  if (cur) chunks.push(cur);
  return chunks;
}

function pickVoice(code) {
  const voices = TTS.getVoices();
  if (!voices.length) return { voices, voice: null };
  const norm = (v) => v.lang.replace("_", "-").toLowerCase();
  const voice =
    voices.find((v) => norm(v) === code.toLowerCase()) ||
    voices.find((v) => norm(v).startsWith(code.slice(0, 2).toLowerCase()));
  return { voices, voice };
}

function resetSpeakButtons() {
  document.querySelectorAll(".speakBtn").forEach((b) => {
    b.classList.remove("speaking");
    b.textContent = t("btn_listen");
  });
  speakingBtn = null;
}

function stopSpeaking() {
  if (TTS) { try { TTS.cancel(); } catch (e) {} }
  resetSpeakButtons();
}

function speak(text, btn) {
  if (!TTS) {
    $("chatErr").textContent = t("tts_unsupported");
    return;
  }
  stopSpeaking();
  $("chatErr").textContent = "";
  const code = speechCode();
  const { voices, voice } = pickVoice(code);
  if (voices.length && !voice) {
    $("chatErr").textContent = t("tts_no_voice");
    return;
  }
  const chunks = splitChunks(plainText(text));
  if (!chunks.length) return;

  if (btn) { btn.classList.add("speaking"); btn.textContent = t("btn_stop_listen"); speakingBtn = btn; }
  chunks.forEach((chunk, i) => {
    const u = new SpeechSynthesisUtterance(chunk);
    u.lang = code;
    if (voice) u.voice = voice;
    u.rate = 0.95;
    if (i === chunks.length - 1) u.onend = () => { if (speakingBtn === btn) resetSpeakButtons(); };
    u.onerror = (e) => { if (e.error !== "canceled" && e.error !== "interrupted") resetSpeakButtons(); };
    TTS.speak(u);
  });
}

if (TTS) { TTS.onvoiceschanged = () => {}; TTS.getVoices(); }

function addSpeakButton(div, text) {
  if (!TTS) return null;
  const b = document.createElement("button");
  b.className = "speakBtn";
  b.textContent = t("btn_listen");
  b.onclick = () => {
    if (speakingBtn === b) stopSpeaking(); else speak(text, b);
  };
  div.appendChild(b);
  return b;
}

function showReply(div, text) {
  div.innerHTML = fmt(text);
  const btn = addSpeakButton(div, text);
  if (btn && $("autoSpeak").checked) speak(text, btn);
}

$("autoSpeak").onchange = () => { if (!$("autoSpeak").checked) stopSpeaking(); };
window.addEventListener("beforeunload", stopSpeaking);

// ---------- ચેટ ----------
function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = fmt(text);
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

async function send() {
  stopListening();
  stopSpeaking();
  const text = $("msg").value.trim();
  if (!text) return;
  $("chatErr").textContent = "";
  $("micHint").textContent = "";
  addMsg("user", text);
  $("msg").value = "";
  const waiting = addMsg("model", t("thinking", { n: 0 }));
  let secs = 0;
  const ticker = setInterval(() => {
    secs += 1;
    waiting.textContent = t("thinking", { n: secs });
  }, 1000);
  $("sendBtn").disabled = true;
  try {
    const data = await api("/ai/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, language: curLang || "gu", history: chatHistory.slice(-10) }),
    }, 90000, "chat");
    clearInterval(ticker);
    showReply(waiting, data.reply);
    $("log").scrollTop = $("log").scrollHeight;
    chatHistory.push({ role: "user", text: text.slice(0, 2000) });
    chatHistory.push({ role: "model", text: String(data.reply || "").slice(0, 2000) });
  } catch (e) {
    console.error("chat error", e);
    clearInterval(ticker);
    waiting.remove();
    $("chatErr").textContent = e.message;
  } finally {
    clearInterval(ticker);
    $("sendBtn").disabled = false;
  }
}
$("sendBtn").onclick = send;
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

// ---------- ફોટો નિદાન ----------
$("diagBtn").onclick = async () => {
  stopSpeaking();
  const file = $("photo").files[0];
  $("chatErr").textContent = "";
  if (!file) { $("chatErr").textContent = t("err_pick_photo"); return; }
  if (file.size > 5 * 1024 * 1024) { $("chatErr").textContent = t("err_photo_big"); return; }
  const form = new FormData();
  form.append("image", file);
  form.append("question", $("photoQ").value.trim());
  form.append("language", curLang || "gu");
  $("diagBtn").disabled = true;
  $("diagOut").classList.remove("hide");
  $("diagOut").textContent = t("diag_loading");
  try {
    const data = await api("/ai/diagnose", { method: "POST", body: form }, 90000, "diagnose");
    showReply($("diagOut"), data.reply);
  } catch (e) {
    console.error("diagnose error", e);
    $("diagOut").classList.add("hide");
    $("chatErr").textContent = e.message;
  } finally {
    $("diagBtn").disabled = false;
  }
};

// ---------- 🌦️ હવામાન સલાહ ----------
let picked = null;       // પસંદ કરેલું સ્થળ (યાદીમાંથી કે GPS)
let sugTimer = null;
let sugSeq = 0;

function dayLabel(iso) {
  const p = String(iso || "").split("-");
  return p.length === 3 ? p[2] + "/" + p[1] : iso;
}
function val(v, unit) {
  return v === null || v === undefined ? "-" : v + unit;
}
function placeTitle(p) {
  return [p.name, p.district, p.state].filter(Boolean).join(", ");
}

function setPicked(p) {
  picked = p;
  const box = $("wPicked");
  if (p) {
    box.textContent = p.gps
      ? t("w_picked_gps", { lat: p.latitude, lon: p.longitude })
      : t("w_picked", { name: placeTitle(p) });
    box.classList.remove("hide");
  } else {
    box.textContent = "";
    box.classList.add("hide");
  }
}

function hideSuggest() {
  $("wSuggest").classList.add("hide");
  $("wSuggest").innerHTML = "";
}

function renderSuggest(results) {
  const box = $("wSuggest");
  box.innerHTML = "";
  if (!results.length) {
    const none = document.createElement("div");
    none.className = "none";
    none.textContent = t("w_none");
    box.appendChild(none);
  } else {
    results.forEach((p) => {
      const item = document.createElement("div");
      const title = document.createElement("b");
      title.textContent = p.name || "";
      const sub = document.createElement("small");
      sub.textContent = [p.taluka, p.district, p.state].filter(Boolean).join(" · ");
      item.appendChild(title);
      item.appendChild(sub);
      item.onclick = () => {
        setPicked(p);
        $("wLoc").value = p.name || "";
        hideSuggest();
      };
      box.appendChild(item);
    });
  }
  box.classList.remove("hide");
}

$("wLoc").addEventListener("input", () => {
  setPicked(null);
  clearTimeout(sugTimer);
  const q = $("wLoc").value.trim();
  if (q.length < 3) { hideSuggest(); return; }
  sugTimer = setTimeout(async () => {
    const seq = ++sugSeq;
    try {
      const data = await api("/weather/places?q=" + encodeURIComponent(q), {}, 15000, "places");
      if (seq !== sugSeq) return;
      renderSuggest(data.results || []);
    } catch (e) {
      if (seq === sugSeq) hideSuggest();
    }
  }, 350);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".acwrap")) hideSuggest();
});

$("gpsBtn").onclick = () => {
  $("chatErr").textContent = "";
  if (!navigator.geolocation) {
    $("chatErr").textContent = t("geo_unsupported");
    return;
  }
  $("gpsBtn").disabled = true;
  $("gpsBtn").textContent = t("gps_finding");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      setPicked({
        name: "My location",
        gps: true,
        latitude: Number(pos.coords.latitude.toFixed(4)),
        longitude: Number(pos.coords.longitude.toFixed(4)),
      });
      $("wLoc").value = "";
      hideSuggest();
      $("gpsBtn").disabled = false;
      $("gpsBtn").textContent = t("btn_gps");
    },
    (err) => {
      const keys = { 1: "geo_denied", 2: "geo_unavailable", 3: "geo_timeout" };
      $("chatErr").textContent = t(keys[err.code] || "geo_fail");
      $("gpsBtn").disabled = false;
      $("gpsBtn").textContent = t("btn_gps");
    },
    { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
  );
};

$("wBtn").onclick = async () => {
  stopSpeaking();
  hideSuggest();
  const loc = $("wLoc").value.trim();
  $("chatErr").textContent = "";

  const body = { crop: $("wCrop").value.trim(), language: curLang || "gu" };
  if (picked) {
    body.latitude = picked.latitude;
    body.longitude = picked.longitude;
    body.place_name = picked.name || "";
  } else if (loc.length >= 2) {
    body.location = loc;
  } else {
    $("chatErr").textContent = t("err_enter_place");
    return;
  }

  $("wBtn").disabled = true;
  $("wBtn").textContent = t("w_loading");
  $("wOut").classList.add("hide");
  try {
    const data = await api("/weather/advice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }, 90000, "weather");
    const p = data.place;
    const label = picked && picked.gps
      ? t("w_your_location", { lat: p.latitude, lon: p.longitude })
      : placeTitle(p);
    const c = data.current;
    $("wNow").innerHTML =
      "📍 <b>" + esc(label) + "</b><br>" +
      esc(t("w_now", {
        temp: val(c.temp_c, "°C"),
        hum: val(c.humidity_pct, "%"),
        wind: val(c.wind_kmh, " km/h"),
      }));

    let rows = "<tr><th>" + esc(t("w_col_date")) + "</th><th>" + esc(t("w_col_temp")) +
      "</th><th>" + esc(t("w_col_rain")) + "</th><th>" + esc(t("w_col_chance")) +
      "</th><th>" + esc(t("w_col_wind")) + "</th></tr>";
    data.days.forEach((d) => {
      rows += "<tr><td>" + esc(dayLabel(d.date)) + "</td>" +
        "<td>" + esc(val(d.temp_min_c, "°")) + " - " + esc(val(d.temp_max_c, "°")) + "</td>" +
        "<td>" + esc(val(d.rain_mm, " mm")) + "</td>" +
        "<td>" + esc(val(d.rain_chance_pct, "%")) + "</td>" +
        "<td>" + esc(val(d.wind_max_kmh, " km/h")) + "</td></tr>";
    });
    $("wTable").innerHTML = rows;

    $("wOut").classList.remove("hide");
    showReply($("wAdvice"), data.advice);
  } catch (e) {
    console.error("weather error", e);
    $("chatErr").textContent = e.message;
  } finally {
    $("wBtn").disabled = false;
    $("wBtn").textContent = t("btn_weather");
  }
};
$("wLoc").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("wBtn").click(); }
});

async function init() {
  try {
    const data = await getJson(API + "/i18n/languages", 15000);
    LANGS = data.languages && data.languages.length ? data.languages : FALLBACK_LANGS;
  } catch (e) {
    LANGS = FALLBACK_LANGS;
  }

  if (curLang && LANGS.some((l) => l.code === curLang)) {
    try {
      S = await loadStrings(curLang);
    } catch (e) {
      try { if (!Object.keys(EN).length) EN = await getJson(BASE + "/app/i18n/en.json"); } catch (e2) {}
      S = EN;
    }
    applyStrings();
    $("gate").classList.add("hide");
  } else {
    curLang = "";
    renderGate();
  }
  showView();
}
init();
